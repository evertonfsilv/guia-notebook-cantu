<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuração do notebook — Cantu Inc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#4E008E; --accent-dark:#2E0A57;
  --paper:#FFFFFF; --card:#FFFFFF; --ink:#111827; --ink-soft:#6B7280; --line:#E5E7EB; --surface:#F9FAFB;
  --ok:#15803D; --ok-bg:#F0FDF4;
  --font-head:'Inter',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);line-height:1.65;display:flex;flex-direction:column;min-height:100vh;font-size:16px}
img{max-width:100%;display:block;border-radius:6px}
b,strong{font-weight:700}

/* Topbar — simples, sem decoração */
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.topbar-inner{max-width:640px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px}
.topbar img.logo{height:20px;flex:0 0 auto}
.topbar .step-count{margin-left:auto;font-size:13px;color:var(--ink-soft);font-weight:600;white-space:nowrap}
.topbar button.menu-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.topbar button.menu-btn:hover{background:var(--surface)}
.progress-track{height:3px;background:var(--line)}
.progress-fill{height:100%;background:var(--accent);width:0%;transition:width 250ms ease}

/* Layout */
main{flex:1;display:flex;justify-content:center;padding:32px 20px 120px}
.card{width:100%;max-width:600px}

.step-label{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.3px}
h1.step-title{font-family:var(--font-head);font-size:22px;font-weight:700;margin:8px 0 18px;color:var(--ink);line-height:1.3}

/* Instrução principal em destaque, sempre a primeira coisa lida */
.action-box{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;
  padding:14px 16px;margin-bottom:18px;font-size:15.5px;font-weight:600;color:var(--ink)}
.action-box .action-label{display:block;font-size:11.5px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:4px}

.step-body p{font-size:15px;color:var(--ink);margin:10px 0 0}
.step-body .welcome-card p{font-size:15px;color:var(--ink)}

.step-body .screen{border-radius:8px;overflow:hidden;border:1px solid var(--line);margin:14px 0}
.step-body .screen-inner{padding:22px 18px;min-height:140px;display:flex;flex-direction:column;justify-content:center;background:var(--surface)}
.step-body .s-light,.step-body .s-blue{background:var(--surface)}
.step-body .s-lock{background:var(--accent-dark);align-items:center;text-align:center}
.step-body .s-lock p{color:#fff}
.step-body .s-lock input{width:170px;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.4);color:#fff;font-size:12px;padding:7px 8px;border-radius:4px;margin:0 auto 6px;display:block}
.step-body .icon-box{width:32px;height:32px;border-radius:6px;background:var(--accent-dark);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.step-body .icon-box svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2}
.step-body .btn-ghost,.step-body .btn-solid{display:inline-block;font-size:13px;font-weight:600;padding:8px 16px;border-radius:6px}
.step-body .btn-ghost{border:1px solid var(--line);color:var(--ink)}
.step-body .btn-solid{background:var(--accent-dark);color:#fff;border:none}
.step-body .fine{font-size:12px;color:var(--ink-soft)}

/* Intro / outro — direto ao ponto, sem ilustração */
.intro-card,.outro-card{background:#fff}
.outro-card{text-align:left}
.outro-check{width:40px;height:40px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:flex;align-items:center;justify-content:center;margin-bottom:14px}

.done-row{margin-top:22px;display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:8px}
.done-row input{width:18px;height:18px;accent-color:var(--ok)}
.done-row label{font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}

/* Footer nav */
.footer-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:20}
.footer-nav-inner{max-width:600px;margin:0 auto;padding:14px 20px;display:flex;gap:10px;align-items:center}
.btn-nav{font-family:var(--font-body);font-weight:700;font-size:14.5px;padding:12px 18px;border-radius:8px;cursor:pointer;border:none}
.btn-prev{background:#fff;color:var(--accent-dark);border:1px solid var(--accent)}
.btn-prev:hover{background:var(--surface)}
.btn-prev:disabled{opacity:0.35;cursor:default}
.btn-next{background:var(--accent);color:#fff;margin-left:auto}
.btn-next:hover{background:var(--accent-dark)}

/* Side panel — lista simples, sem cor decorativa */
.overlay{position:fixed;inset:0;background:rgba(17,24,39,0.4);z-index:30;opacity:0;pointer-events:none;transition:opacity 200ms ease}
.overlay.open{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:300px;max-width:88vw;background:#fff;z-index:31;box-shadow:-6px 0 18px rgba(0,0,0,0.10);
  transform:translateX(100%);transition:transform 220ms ease;display:flex;flex-direction:column}
.panel.open{transform:translateX(0)}
.panel-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.panel-head h2{font-size:14px;margin:0;font-weight:700}
.panel-head button{border:none;background:none;font-size:18px;cursor:pointer;color:var(--ink-soft)}
.panel-list{overflow-y:auto;padding:6px 0;flex:1}
.panel-item{display:flex;align-items:center;gap:10px;padding:9px 18px;cursor:pointer;font-size:13px;color:var(--ink)}
.panel-item:hover{background:var(--surface)}
.panel-item.active{background:var(--surface);font-weight:700}
.panel-item .dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:9px;color:transparent}
.panel-item.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.panel-item .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media(max-width:520px){
  h1.step-title{font-size:19px}
}
</style>
</head>

<p>Se todas as etapas foram seguidas, seu notebook já está conectado, seguro e em conformidade com as políticas de TI da Cantu Inc.</p><p>Ficou alguma dúvida ou algo não saiu como esperado? Procure o setor de TI antes de seguir usando o equipamento normalmente.</p>"}]</script>
<script>
const SCREENS = JSON.parse(document.getElementById('wizard-data').textContent);
const STORAGE_KEY = 'cantu-guia-notebook-progress-v2';

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return { current: 0, done: [] };
    const parsed = JSON.parse(raw);
    return { current: parsed.current || 0, done: parsed.done || [] };
  } catch(e) { return { current: 0, done: [] }; }
}
function saveState(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

let state = loadState();
if(state.current < 0 || state.current >= SCREENS.length) state.current = 0;

const cardRoot = document.getElementById('cardRoot');
const stepCount = document.getElementById('stepCount');
const progressFill = document.getElementById('progressFill');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const panel = document.getElementById('panel');
const overlay = document.getElementById('overlay');
const panelList = document.getElementById('panelList');

function isDone(i){ return state.done.indexOf(i) !== -1; }
function markDone(i, val){
  const idx = state.done.indexOf(i);
  if(val && idx === -1) state.done.push(i);
  if(!val && idx !== -1) state.done.splice(idx,1);
  saveState();
}

// Extrai a primeira frase de instrução (o que fazer) do corpo, pra destacar no topo,
// e devolve também o corpo SEM esse parágrafo (evita repetir o mesmo texto duas vezes)
function extractAction(bodyHtml){
  const tmp = document.createElement('div');
  tmp.innerHTML = bodyHtml;
  const p = tmp.querySelector('.step-copy > p, p');
  const action = p ? p.innerHTML : '';
  if(p) p.remove();
  return { action, restHtml: tmp.innerHTML };
}

function renderPanel(){
  panelList.innerHTML = SCREENS.map((s,i) => {
    const label = s.kind === 'intro' ? 'Boas-vindas' : s.kind === 'outro' ? 'Conclusão' : (s.eyebrow + ' — ' + s.title);
    const activeCls = i === state.current ? ' active' : '';
    const doneCls = isDone(i) ? ' done' : '';
    return `<div class="panel-item${activeCls}${doneCls}" data-i="${i}">
      <span class="dot">${isDone(i) ? '✓' : ''}</span>
      <span class="lbl">${label}</span>
    </div>`;
  }).join('');
  panelList.querySelectorAll('.panel-item').forEach(el => {
    el.addEventListener('click', () => {
      state.current = parseInt(el.getAttribute('data-i'), 10);
      saveState();
      render();
      closePanel();
    });
  });
}

function render(){
  const i = state.current;
  const s = SCREENS[i];
  stepCount.textContent = `Etapa ${i+1} de ${SCREENS.length}`;
  progressFill.style.width = ((i) / (SCREENS.length - 1) * 100) + '%';

  let html = '';
  if(s.kind === 'intro'){
    html += `<div class="intro-card">
      <div class="step-label">Antes de começar</div>
      <h1 class="step-title">${s.title}</h1>
      <div class="step-body">${s.body}</div>
    </div>`;
  } else if(s.kind === 'outro'){
    html += `<div class="outro-card">
      <div class="outro-check">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <div class="step-label">Concluído</div>
      <h1 class="step-title">${s.title}</h1>
      <div class="step-body">${s.body}</div>
    </div>`;
  } else {
    const { action, restHtml } = extractAction(s.body);
    html += `<div class="step-label">${s.section} · ${s.eyebrow}</div>
      <h1 class="step-title">${s.title}</h1>
      ${action ? `<div class="action-box"><span class="action-label">O que fazer</span>${action}</div>` : ''}
      <div class="step-body">${restHtml}</div>
      <div class="done-row">
        <input type="checkbox" id="doneCheck" ${isDone(i) ? 'checked' : ''}>
        <label for="doneCheck">Marquei esta etapa como concluída</label>
      </div>`;
  }
  cardRoot.innerHTML = html;

  const chk = document.getElementById('doneCheck');
  if(chk){
    chk.addEventListener('change', () => markDone(i, chk.checked));
  }

  prevBtn.disabled = i === 0;
  nextBtn.textContent = i === SCREENS.length - 1 ? 'Concluir' : (s.kind === 'intro' ? 'Começar' : 'Avançar');

  renderPanel();
  window.scrollTo({top:0, behavior:'instant'});
}

function goNext(){
  const i = state.current;
  if(SCREENS[i].kind === 'step') markDone(i, true);
  if(i < SCREENS.length - 1){
    state.current = i + 1;
    saveState();
    render();
  }
}
function goPrev(){
  if(state.current > 0){
    state.current -= 1;
    saveState();
    render();
  }
}
function openPanel(){ panel.classList.add('open'); overlay.classList.add('open'); }
function closePanel(){ panel.classList.remove('open'); overlay.classList.remove('open'); }

nextBtn.addEventListener('click', goNext);
prevBtn.addEventListener('click', goPrev);
document.getElementById('openPanelBtn').addEventListener('click', openPanel);
document.getElementById('closePanelBtn').addEventListener('click', closePanel);
overlay.addEventListener('click', closePanel);
document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight') goNext();
  if(e.key === 'ArrowLeft') goPrev();
  if(e.key === 'Escape') closePanel();
});

render();
</script>
</body>
</html>
